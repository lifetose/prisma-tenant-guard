name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run verify

  consume:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Require the built package from CommonJS
        run: node -e "const m=require('./dist/cjs/index.js');const t=require('./dist/cjs/testing/index.js');if(typeof m.defineTenancy!=='function'||typeof t.auditTenancy!=='function')process.exit(1)"
      - name: Import the built package from ESM
        run: node --input-type=module -e "import {defineTenancy} from './dist/esm/index.js';import {auditTenancy} from './dist/esm/testing/index.js';if(typeof defineTenancy!=='function'||typeof auditTenancy!=='function')process.exit(1)"

  rls:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_guard
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Prove the generated policies on a real postgres
        run: npx vitest run src/rls/postgres.integration.test.ts
        env:
          TENANT_GUARD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_guard
